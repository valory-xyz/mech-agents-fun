[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project]
name = "agents.fun"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    # OA / open-aea / plugins — pinned exactly (framework contract).
    "open-autonomy[all]==0.21.26",
    "open-aea-ledger-ethereum==2.2.9",
    "open-aea-ledger-cosmos==2.2.9",
    "open-aea-test-autonomy==0.21.26",
    "open-aea-cli-ipfs==2.2.9",
    "open-aea-helpers==0.21.26",
    # Agent-repo (app) deps — exact pins per David's #436 rule.
    # Ranges are reserved for framework/lib repos; agent repos pin
    # everything non-OA throughout.
    "requests==2.32.5",
    "grpcio==1.78.0",
    "asn1crypto<1.5.0,>=1.4.0",
    "hypothesis==6.21.6",
    "web3<8,>=7.0.0",
    "pytest-asyncio==1.3.0",
    "aiohttp<4.0.0,>=3.8.5",
    "certifi==2026.2.25",
    "multidict==6.7.1",
    "ecdsa>=0.15",
    "py-ecc<10,>=8",
    "websocket_client<1,>=0.32.0",
    "pytest==8.4.2",
    "openapi-core==0.22.0",
    "openapi-spec-validator<0.8.0,>=0.7.0",
    "jsonschema>=4.23.0,<5.0.0",
    "prometheus-client==0.23.1",
    "pebble==5.1.3",
    "pyyaml<7.0.0,>=6.0.0",
    "python-dotenv==0.21.1",
    # Custom-tool AI / media deps — exact pins per agent-repo rule
    # (each tool is configured against a specific version).
    "openai==1.82.0",
    "replicate==0.28.0",
    "moviepy==1.0.3",
    "anthropic==0.21.3",
    "google-api-python-client==2.130.0",
    "tiktoken==0.12.0",
    "httpx==0.28.1",
    "pydantic>=2.0.0,<3.0.0",
    "pillow==12.2.0",
    # kv_store connection (pulled in as a transitive of delivery_rate_abci
    # under mech v0.34.4 / OA 0.21.26) imports peewee at module level.
    # Version tracks the connection's own dependencies pin.
    "peewee==3.17.5",
    # task_submission_abci's predict_api_events_client uses eth_utils.keccak
    # for the batch idempotency hash. Version tracks the skill.yaml pin.
    "eth-utils==6.0.0",
]

[project.urls]
Repository = "https://github.com/valory-xyz/agents-fun-mech"

[dependency-groups]
dev = [
    "setuptools>=78.0.1,<79",
    "tomte[cli, tests] @ git+https://github.com/valory-xyz/tomte.git@v0.7.0",
]

[tool.uv]
default-groups = "all"
prerelease = "allow"
# OA 0.21.26 has open-aea-ledger-solana 2.2.9 as a direct (non-optional)
# dep; its solana<0.34 pin conflicts with google-genai's websockets>=13.
# Solana is never imported (required_ledgers = ethereum + cosmos), so
# force a solana series with widened websockets. solders bound tracks
# solana 0.36.x's requires-dist (>=0.23,<0.27).
# Note: override-dependencies is uv-only. Plain `pip install -e .` will
# ignore it and re-resolve the conflict. CI uses tox-uv everywhere, but
# local installs should go through `uv sync`.
override-dependencies = [
    "solana>=0.36.0,<0.37.0",
    "solders>=0.23,<0.27",
    # cffi 2.1.0+ (transitive via cryptography << open-aea-ledger-solana)
    # reports its license as MIT-0, which tomte's PARANOID liccheck rejects.
    # Constrain to the previous minor until the tomte allowlist covers MIT-0.
    "cffi<2.1",
]

[tool.tomte]
# Dev customs are under packages/agents_fun/customs/, agent + service
# under packages/valory/. Pin packages_paths to the primary first-party
# author so canonical env vars resolve sensibly.
packages_paths = "packages/valory"
# Third-party skills/contracts on disk are synced from mech upstream.
upstream_pins = ["valory-xyz/mech@v0.34.6"]
tomte_dep_pin = " @ git+https://github.com/valory-xyz/tomte.git@v0.7.0"
# Customs are file-form (no per-pkg tests/ dir). The only first-party
# tests live under tests/; without pinning, auto-discovery picks up
# upstream `packages/valory/skills/.../tests/` (abstract_round_abci,
# task_execution) whose handler-log assertions and tendermint-binary
# deps don't apply downstream.
pytest_targets = ["tests"]

[tool.uv.build-backend]
module-name = ["packages"]
module-root = ""
