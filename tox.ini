; Local extensions to tomte's canonical tox.ini. Consumed by `tomte tox`.

[tomte-extensions]
; Most runtime deps auto-mirror from [project].dependencies. Listed here
; are range-form overrides for runtime deps where the package YAML uses
; a range expression — `aea-helpers check-dependencies` does
; string-strict matching so the form must agree on both sides. Plus
; lint-only werkzeug/attrs not in pyproject.
extra_deps =
    protobuf<7,>=5
    web3<8,>=7.0.0
    aiohttp<4.0.0,>=3.8.5
    asn1crypto<1.5.0,>=1.4.0
    py-ecc<10,>=8
    websocket_client<1,>=0.32.0
    openapi-spec-validator<0.8.0,>=0.7.0
    jsonschema>=4.23.0,<5.0.0
    pyyaml<7.0.0,>=6.0.0
    prometheus_client>=0.23.1,<0.24
    pebble>=5.1,<6
    typing_extensions<=4.15.0,>=3.10.0.2
    werkzeug==3.1.6
    attrs==25.4.0

; Mech tool packages mirror upstream API surfaces (OpenAI/Anthropic-style
; client wrappers, top-level run() entry points with key-rotation
; fallback handlers). The patterns below are pervasive and intentional
; across packages/agents_fun/customs/*:
; - W0718 broad-exception-caught: tool entry points must surface ANY
;   error as part of the (result, ...) return tuple instead of crashing
;   the agent loop; a bare `except Exception` is the correct shape.
; - W0613 unused-argument: tools accept compatibility kwargs (timeout,
;   top_p, n, stop, ...) to match upstream client signatures even when
;   a given backend ignores them.
; - W0102 dangerous-default-value: mutable defaults mirror the
;   OpenAI/Anthropic SDK signatures the wrappers shadow.
extra_pylint_disables = W0718,W0613,W0102

; moviepy attaches fx methods (.volumex, .audio_fadein, ...) at import
; time via decorators, so pylint can't infer them and emits E1101
; no-member. wave.open(filename, "wb") returns a Wave_write but pylint's
; type inference picks the read branch. Both are stdlib/library
; idiomatic usages; ignore the modules wholesale.
extra_pylint_ignored_modules = moviepy,wave

; Local liccheck variant with --no-deps. OA pulls open-aea-ledger-solana
; whose metadata pins solana<0.34 / websockets<12; google-genai pins
; websockets>=13. pkg_resources.resolve() raises VersionConflict on this
; metadata graph even though solana is never imported at runtime. liccheck
; still checks the license of every package in the freeze (direct +
; transitive), since tomte freeze-dependencies emits the full pip freeze;
; only the pkg_resources graph walk is skipped.
[testenv:liccheck-flat]
skipsdist = True
usedevelop = True
deps =
    pip
    setuptools<81
    tomte[liccheck,cli] @ git+https://github.com/valory-xyz/tomte.git@v0.7.0
commands =
    tomte freeze-dependencies --output-path {envtmpdir}/requirements.txt
    liccheck -s {toxinidir}/.tomte-tox.ini -r {envtmpdir}/requirements.txt -l PARANOID --no-deps

[pytest]
; Opt in to tomte's canonical pytest defaults — required for the
; `integration` marker used below. Plugin is silent without this flag so
; non-fleet `tomte[black]` consumers don't get unexpected config injection.
tomte_defaults = true
; -p no:pytest_anchorpy: anchorpy (transitive via solana) registers a pytest11
;   plugin whose top-level import expects solana 0.33 layout; we forced solana
;   >=0.36 (websockets fix), and anchorpy 0.20.2 imports `solana.transaction`
;   which moved in 0.36. The plugin is unused by our tests; disable autoload.
; -m 'not integration': tool tests in tests/test_tools.py spin up isolated
;   venvs and call live LLM/image/video APIs; skip in CI, run locally with
;   `pytest tests -m integration`.
addopts = -p no:pytest_anchorpy -m 'not integration'

[mypy]
warn_unused_ignores = False
warn_redundant_casts = False
disable_error_code = redundant-cast,unused-ignore

; Repo-specific overrides (third-party packages synced via IPFS, not
; lint-clean — these come from mech upstream).
[mypy-packages.valory.connections.*]
ignore_errors = True

[mypy-packages.valory.contracts.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-packages.valory.protocols.*]
ignore_errors = True

[mypy-packages.valory.skills.*]
ignore_errors = True

; Third-party libs without type stubs not covered by tomte canonical.
[mypy-replicate.*]
ignore_missing_imports = True

[mypy-moviepy.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-stability_sdk.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True


[Authorized Packages]
; open-autonomy wheel metadata reports "Other/Proprietary"; actual license is Apache-2.0.
open-autonomy: ==0.21.23
; Transitive via solana (forced to >=0.36 by [tool.uv] override-dependencies
; so OA's open-aea-ledger-solana plugin doesn't pin websockets<12 against
; google-genai's >=13). All three are MIT per upstream repos but expose no
; PyPI License field, so PARANOID liccheck reports them UNKNOWN.
anchorpy: 0.20.2
based58: 0.1.1
jsonalias: 0.1.1
; numpy compound license (BSD-3 + 0BSD + MIT + Zlib + CC0); permissive.
numpy: *
; Permissive licenses without classifier metadata.
chardet: *
greenlet: *
pillow: *
replicate: *
shellingham: *
faiss-cpu: *
